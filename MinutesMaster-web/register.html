<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — MinutesMaster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
<div class="auth-card">

  <!-- Logo -->
  <div class="auth-logo">
    <div class="auth-logo-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="8"  y1="22" x2="16" y2="22"/>
      </svg>
    </div>
    <span class="auth-logo-text">MinutesMaster</span>
  </div>

  <h1 class="auth-title">Create account</h1>
  <p class="auth-sub">Verify your email to get started.</p>

  <!-- Step bar -->
  <div class="step-bar">
    <div class="step-item active" id="si1">
      <div class="step-dot">1</div>Verify Email
    </div>
    <div class="step-connector"></div>
    <div class="step-item" id="si2">
      <div class="step-dot">2</div>Create Account
    </div>
  </div>

  <div class="alert alert-error"   id="regError"></div>
  <div class="alert alert-success" id="regSuccess"></div>

  <!-- ── STEP 1: Email + OTP ── -->
  <div class="step-panel active" id="panelStep1">
    <div class="field-group">
      <label class="field-label" for="regEmail">Email Address</label>
      <div class="otp-row">
        <input class="field-input" type="email" id="regEmail"
               placeholder="you@example.com" autocomplete="email" />
        <button type="button" class="btn-secondary" id="sendOtpBtn">Send OTP</button>
      </div>
      <div class="otp-hint" id="otpCountdown" style="display:none;"></div>
    </div>

    <div id="otpInputArea" style="display:none;">
      <div class="field-group">
        <label class="field-label" for="regOtp">
          Enter OTP
          <span style="font-weight:400;color:var(--text-secondary);"> (check your inbox)</span>
        </label>
        <input class="field-input" type="text" id="regOtp"
               placeholder="6-digit OTP" maxlength="6" inputmode="numeric" />
      </div>
      <button type="button" class="btn-primary" id="verifyOtpBtn">
        <div class="btn-spinner" id="verifySpinner"></div>
        Verify Email
      </button>
    </div>
  </div>

  <!-- ── STEP 2: Username + Phone + Password ── -->
  <div class="step-panel" id="panelStep2">
    <div style="margin-bottom:14px;">
      <span class="verified-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Email verified
      </span>
    </div>

    <div class="field-group">
      <label class="field-label" for="regUsername">Create Username</label>
      <input class="field-input" type="text" id="regUsername"
             placeholder="3–20 chars (letters, numbers, _)" autocomplete="username" />
    </div>

    <div class="field-group">
      <label class="field-label" for="regPhone">Mobile Number <span style="font-weight:400;color:var(--text-muted);">(optional)</span></label>
      <input class="field-input" type="tel" id="regPhone"
             placeholder="10-digit mobile number" maxlength="10" inputmode="numeric" />
    </div>

    <div class="field-group">
      <label class="field-label" for="regPassword">Create Password</label>
      <div class="pw-wrap">
        <input class="field-input" type="password" id="regPassword"
               placeholder="At least 6 characters" autocomplete="new-password" />
        <button type="button" class="pw-toggle" id="toggleRegPwd" tabindex="-1" aria-label="Show/hide">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="otp-hint" id="pwStrength"></div>
    </div>

    <button type="button" class="btn-primary" id="registerBtn" style="margin-top:6px;">
      <div class="btn-spinner" id="registerSpinner"></div>
      Create Account
    </button>
  </div>

  <hr class="auth-divider" />
  <div class="auth-footer">
    <p class="auth-footer-text">Already have an account?</p>
    <a href="auth.html" class="btn-outline">Sign In</a>
  </div>

</div>

<script src="auth.js"></script>
<script>
(function () {
  const t = localStorage.getItem('mm_theme');
  if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  if (localStorage.getItem('mm_token')) window.location.href = 'index.html';
})();

let verifiedEmail = null;

function showEl(id, text) { const el = document.getElementById(id); el.textContent = text; el.classList.add('show'); }
function hideEl(id)        { document.getElementById(id).classList.remove('show'); }

function countdown(elId, secs, done) {
  const el = document.getElementById(elId);
  el.style.display = 'block'; let r = secs;
  (function tick() {
    el.textContent = `Resend in ${r}s`;
    if (r-- <= 0) { el.style.display = 'none'; if (done) done(); return; }
    setTimeout(tick, 1000);
  })();
}

function goToStep2() {
  document.getElementById('panelStep1').classList.remove('active');
  document.getElementById('panelStep2').classList.add('active');
  document.getElementById('si1').classList.replace('active', 'done');
  document.getElementById('si1').querySelector('.step-dot').innerHTML =
    '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
  document.getElementById('si2').classList.add('active');
}

/* Send OTP */
document.getElementById('sendOtpBtn').addEventListener('click', async () => {
  const email = document.getElementById('regEmail').value.trim();
  const btn   = document.getElementById('sendOtpBtn');
  hideEl('regError'); hideEl('regSuccess');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showEl('regError', 'Enter a valid email address.'); return; }
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const r = await AuthAPI.sendOTP(email);
    if (r.error) { showEl('regError', r.error); btn.disabled = false; btn.textContent = 'Send OTP'; }
    else {
      showEl('regSuccess', 'OTP sent! Check your email inbox (and spam folder).');
      document.getElementById('otpInputArea').style.display = 'block';
      document.getElementById('regEmail').disabled = true;
      countdown('otpCountdown', 60, () => { btn.disabled = false; btn.textContent = 'Resend OTP'; document.getElementById('regEmail').disabled = false; });
    }
  } catch { showEl('regError', 'Cannot reach server. Make sure it is running.'); btn.disabled = false; btn.textContent = 'Send OTP'; }
});

/* Verify OTP */
document.getElementById('verifyOtpBtn').addEventListener('click', async () => {
  const email = document.getElementById('regEmail').value.trim();
  const otp   = document.getElementById('regOtp').value.trim();
  const btn   = document.getElementById('verifyOtpBtn');
  const sp    = document.getElementById('verifySpinner');
  hideEl('regError'); hideEl('regSuccess');
  if (otp.length !== 6) { showEl('regError', 'Enter the 6-digit OTP.'); return; }
  btn.disabled = true; sp.classList.add('show');
  try {
    const r = await AuthAPI.verifyOTP(email, otp);
    if (r.error) { showEl('regError', r.error); }
    else { verifiedEmail = email; goToStep2(); }
  } catch { showEl('regError', 'Cannot reach server.'); }
  finally { btn.disabled = false; sp.classList.remove('show'); }
});

/* Password strength */
document.getElementById('regPassword').addEventListener('input', function () {
  const el = document.getElementById('pwStrength');
  const v = this.value;
  if (!v) { el.textContent = ''; return; }
  if (v.length < 6)  { el.textContent = 'Too short (min 6 characters)'; el.style.color = 'var(--red)'; }
  else if (v.length < 10) { el.textContent = 'Moderate'; el.style.color = 'var(--text-muted)'; }
  else { el.textContent = '✓ Strong password'; el.style.color = 'var(--green)'; }
});
document.getElementById('toggleRegPwd').onclick = () => {
  const i = document.getElementById('regPassword');
  i.type = i.type === 'password' ? 'text' : 'password';
};

/* Register */
document.getElementById('registerBtn').addEventListener('click', async () => {
  const username = document.getElementById('regUsername').value.trim();
  const phone    = document.getElementById('regPhone').value.trim();
  const password = document.getElementById('regPassword').value;
  const btn      = document.getElementById('registerBtn');
  const sp       = document.getElementById('registerSpinner');
  hideEl('regError'); hideEl('regSuccess');
  if (!verifiedEmail) { showEl('regError', 'Please verify your email first.'); return; }
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) { showEl('regError', 'Username must be 3–20 characters (letters, numbers, underscores only).'); return; }
  if (password.length < 6) { showEl('regError', 'Password must be at least 6 characters.'); return; }
  btn.disabled = true; sp.classList.add('show');
  try {
    const r = await AuthAPI.register(verifiedEmail, username, password, phone || null);
    if (r.error) { showEl('regError', r.error); }
    else {
      localStorage.setItem('mm_token',    r.token);
      localStorage.setItem('mm_username', r.username);
      sessionStorage.setItem('auth_msg', `Welcome, ${r.username}! Your account has been created.`);
      window.location.href = 'index.html';
    }
  } catch { showEl('regError', 'Cannot reach server.'); }
  finally { btn.disabled = false; sp.classList.remove('show'); }
});
</script>
</body>
</html>
